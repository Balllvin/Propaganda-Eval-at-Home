# Judge with any OpenAI-compatible model instead of grok-4.7. Scores are then NOT comparable with the Nous
# leaderboard or the reference runs, and the report says so. A local judge costs nothing and needs no --spend.

[model]
base_url = "http://127.0.0.1:8080/v1"
model = "your-org/your-model"

[run]
label = "my-model"
profile = "card"

[judge]
url = "http://127.0.0.1:8001/v1"
model = "your-judge-model"
workers = 8
# For a paid judge other than grok-4.7, give its price in USD per 1M tokens:
# price = [0.50, 1.50]
# key_env = "JUDGE_API_KEY"
